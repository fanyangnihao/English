server {
    listen 80;
    server_name 47.108.199.245;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/47.108.199.245/current/web;
    client_max_body_size 10m;

    include /www/server/panel/vhost/nginx/extension/47.108.199.245/*.conf;
    include /www/server/panel/vhost/nginx/well-known/47.108.199.245.conf;
    include /www/server/panel/vhost/rewrite/html_47.108.199.245.conf;

    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.gitignore|\.gitattributes|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?) {
        return 404;
    }

    location ~* /(\.git|\.svn|\.vscode|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|node_modules)/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ai/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location ~* \.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 12h;
        access_log off;
    }

    access_log /www/wwwlogs/47.108.199.245.log;
    error_log /www/wwwlogs/47.108.199.245.error.log;
}
